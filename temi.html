<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Temi | Marco Palmas</title>

    <meta name="description"
        content="Scopri i temi del blog di Marco Palmas: stress, mindfulness, sport, infermieristica e vita reale.">

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f3f5f1;
            color: #202620;
            line-height: 1.6;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* HEADER */

        header {
            min-height: 430px;
            background-image: url("./header-temi.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* NAVIGAZIONE */

        nav {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px 34px;
            padding: 22px 20px;
            background: #ffffff;
            border-bottom: 1px solid #dfe5df;
        }

        nav a {
            color: #123d2b;
            font-weight: 600;
            transition: color 0.2s ease, opacity 0.2s ease;
        }

        nav a:hover {
            color: #789d32;
            opacity: 0.8;
        }

        /* CONTENUTO */

        main {
            max-width: 1180px;
            margin: 70px auto 95px;
            padding: 0 24px;
        }

        h1 {
            margin: 0 0 18px;
            text-align: center;
            color: #123d2b;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 500;
            line-height: 1.1;
        }

        .intro {
            max-width: 720px;
            margin: 0 auto 52px;
            text-align: center;
            color: #5b625c;
            font-size: 1.08rem;
        }

        /* GRIGLIA */

        .temi {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 26px;
        }

        /* CARD FOTOGRAFICHE */

        .card {
            display: block;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            border-radius: 22px;
            background-color: #123d2b;
            background-size: cover;
            background-position: center;
            border: 1px solid rgba(18, 61, 43, 0.12);
            box-shadow: 0 8px 24px rgba(18, 61, 43, 0.08);
            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 18px 38px rgba(18, 61, 43, 0.2);
        }

        /* IMMAGINI */

        .card-stress {
            background-image: url("./tema-stress.jpg");
        }

        .card-sport {
            background-image: url("./tema-sport.jpg");
        }

        .card-infermieristica {
            background-image: url("./tema-infermieristica.jpg");
        }

        .card-vita {
            background-image: url("./tema-vita-reale.jpg");
        }

        /* FOOTER */

        footer {
            padding: 42px 20px;
            background: #06130f;
            color: rgba(255, 255, 255, 0.72);
            text-align: center;
            font-size: 0.9rem;
        }

        /* MOBILE */

        @media (max-width: 700px) {
            header {
                min-height: 300px;
            }

            nav {
                gap: 10px 20px;
                padding: 18px 16px;
            }

            main {
                margin-top: 48px;
                margin-bottom: 65px;
                padding: 0 16px;
            }

            .intro {
                margin-bottom: 36px;
                font-size: 1rem;
            }

            .temi {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .card {
                aspect-ratio: auto;
                min-height: 360px;
            }
        }
    </style>
</head>

<body>

    <header></header>

    <nav>
        <a href="index.html">Home</a>
        <a href="articoli.html">Articoli</a>
        <a href="temi.html">Temi</a>
        <a href="chi-sono.html">Chi sono</a>
    </nav>

    <main>

        <h1>Di cosa parliamo</h1>

        <p class="intro">
            Quattro aree per raccogliere pensieri, esperienze e strumenti
            dedicati allo stress, alla consapevolezza, allo sport,
            al lavoro sanitario e alla vita quotidiana.
        </p>

        <section class="temi">

            <a
                href="tema-stress-mindfulness.html"
                class="card card-stress"
                aria-label="Esplora il tema Stress e Mindfulness">
            </a>

            <a
                href="tema-sport-performance.html"
                class="card card-sport"
                aria-label="Esplora il tema Sport e Performance">
            </a>

            <a
                href="tema-infermieristica.html"
                class="card card-infermieristica"
                aria-label="Esplora il tema Infermieristica">
            </a>

            <a
                href="tema-vita-reale.html"
                class="card card-vita"
                aria-label="Esplora il tema Vita reale">
            </a>

        </section>

    </main>

    <footer>
        © Marco Palmas · Stress Management
    </footer>

</body>

</html>
