<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Marco Palmas | Stress Management</title>

<meta name="description" content="Marco Palmas | Stress Management, Mindfulness, Sport e Vita Reale.">

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}


/* =========================================
   HERO
========================================= */

.hero {
    position: relative;

    width: 100%;
    height: 100vh;
    min-height: 650px;

    background-image:
        url("ChatGPT%20Image%206%20set%202026%2C%2019_54_25.png");

    background-size: cover;
    background-position: center center;

    overflow: hidden;
}


/* =========================================
   LEGGERO VELO SCURO
========================================= */

.hero::after {
    content: "";

    position: absolute;
    inset: 0;

    background: rgba(0, 0, 0, 0.08);

    pointer-events: none;
}


/* =========================================
   TESTATA
========================================= */

.header {
    position: absolute;

    top: 0;
    left: 0;

    width: 100%;

    padding: 28px 6%;

    display: flex;
    align-items: flex-start;
    justify-content: space-between;

    z-index: 10;
}


/* =========================================
   NOME
========================================= */

.brand {
    color: white;

    text-shadow:
        0 2px 8px rgba(0,0,0,0.45);
}

.brand h1 {
    margin: 0;

    font-size: 36px;
    line-height: 1;

    font-weight: 700;
}

.brand p {
    margin: 9px 0 0;

    font-size: 13px;

    letter-spacing: 3px;

    text-transform: uppercase;

    font-weight: 500;
}


/* =========================================
   MENU
========================================= */

nav {
    display: flex;

    align-items: center;

    gap: 38px;
}

nav a {
    color: white;

    text-decoration: none;

    font-size: 19px;

    font-weight: 600;

    padding: 8px 0;

    text-shadow:
        0 2px 8px rgba(0,0,0,0.5);

    transition:
        opacity 0.2s ease,
        border-color 0.2s ease;
}

nav a:hover {
    opacity: 0.7;
}

nav a.active {
    border-bottom: 3px solid #d8f29a;
}


/* =========================================
   PULSANTE ARTICOLI
   Posizionato nell'area libera dell'immagine
========================================= */

.article-button {
    position: absolute;

    left: 8.8%;
    bottom: 7%;

    z-index: 10;

    display: inline-flex;

    align-items: center;
    justify-content: center;

    gap: 24px;

    padding: 16px 28px;

    min-width: 305px;

    border-radius: 9px;

    background: rgba(0, 61, 43, 0.94);

    border: 1px solid #a7d477;

    color: white;

    text-decoration: none;

    font-size: 19px;

    font-weight: 600;

    box-shadow:
        0 5px 18px rgba(0,0,0,0.25);

    transition:
        transform 0.2s ease,
        background 0.2s ease;
}

.article-button:hover {
    background: rgba(4, 82, 57, 0.98);

    transform: translateY(-2px);
}

.article-button span {
    font-size: 28px;

    line-height: 1;
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 800px) {

    .hero {
        min-height: 760px;

        background-position: 60% center;
    }

    .header {
        padding: 22px 24px;

        flex-direction: column;

        gap: 22px;
    }

    .brand h1 {
        font-size: 30px;
    }

    .brand p {
        font-size: 10px;

        letter-spacing: 2px;
    }

    nav {
        gap: 20px;

        flex-wrap: wrap;
    }

    nav a {
        font-size: 16px;
    }

    .article-button {
        left: 24px;
        right: 24px;
        bottom: 30px;

        min-width: 0;

        width: calc(100% - 48px);
    }
}

</style>

</head>


<body>


<!-- =========================================
     HERO
========================================= -->

<section class="hero">


    <!-- TESTATA -->

    <header class="header">


        <div class="brand">

            <h1>Marco Palmas</h1>

            <p>
                Stress Management · Mindfulness · Sport · Vita reale
            </p>

        </div>


        <!-- MENU CLICCABILE -->

        <nav>

            <a href="index.html" class="active">
                Home
            </a>

            <a href="articoli.html">
                Articoli
            </a>

            <a href="temi.html">
                Temi
            </a>

            <a href="chi-sono.html">
                Chi sono
            </a>

        </nav>


    </header>


    <!-- PULSANTE CLICCABILE -->

    <a
        href="articoli.html"
        class="article-button"
    >

        Scopri gli articoli

        <span>→</span>

    </a>


</section>


</body>

</html>
