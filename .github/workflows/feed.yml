name: Generate RSS Feed

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate feed.xml
        run: |
          # Intestazione pulita
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<rss version="2.0" xmlns:atom="http://www.w3.org/2005/Atom">\n<channel>\n<title>Articoli di Marco Palmas</title>\n<link>https://marcopalmas.it/articoli.html</link>\n<description>Nuovi articoli su stress, mindfulness, sport, infermieristica e vita reale.</description>\n<language>it-IT</language>\n<atom:link href="https://marcopalmas.it/feed.xml" rel="self" type="application/rss+xml" />\n<lastBuildDate>'"$(date -R)"'</lastBuildDate>\n' > feed.xml

          # Lista dei file HTML (escludiamo le pagine del sito)
          ls *.html | grep -v -E '^(index|chi-sono|temi|mindlab|privacy-policy|categorie-protette|articoli)\.html$' > temp_files.txt

          # Per ogni file, estraiamo titolo e descrizione
          while read -r file; do
            if [ -f "$file" ]; then
              # Estrai titolo (pulito)
              title=$(grep -o '<title>[^<]*</title>' "$file" | head -1 | sed 's/<[^>]*>//g' | sed 's/ | Marco Palmas//' | sed 's/&/&amp;/g')
              # Estrai descrizione
              desc=$(grep -o '<meta name="description" content="[^"]*"' "$file" | head -1 | sed 's/.*content="//;s/"//' | sed 's/&/&amp;/g')
              # Data di modifica
              date=$(git log -1 --format=%aD "$file" 2>/dev/null || date -R)
              
              echo "    <item>" >> feed.xml
              echo "      <title><![CDATA[$title]]></title>" >> feed.xml
              echo "      <link>https://marcopalmas.it/$file</link>" >> feed.xml
              echo "      <description><![CDATA[$desc]]></description>" >> feed.xml
              echo "      <guid isPermaLink=\"true\">https://marcopalmas.it/$file</guid>" >> feed.xml
              echo "      <pubDate>$date</pubDate>" >> feed.xml
              echo "    </item>" >> feed.xml
            fi
          done < temp_files.txt
          
          rm temp_files.txt
          printf '  </channel>\n</rss>\n' >> feed.xml

      - name: Commit feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.xml
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update feed.xml [skip ci]"
          git push