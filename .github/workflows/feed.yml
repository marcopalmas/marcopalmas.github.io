name: Generate RSS Feed

on:
  push:
    branches:
      - main
    paths-ignore:
      - feed.xml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-rss-feed-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate feed.xml
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          from datetime import date, datetime, timezone
          from email.utils import format_datetime, parsedate_to_datetime
          from html.parser import HTMLParser
          from pathlib import Path
          from xml.etree import ElementTree as ET

          SITE_URL = "https://marcopalmas.it"
          ATOM_NS = "http://www.w3.org/2005/Atom"
          ET.register_namespace("atom", ATOM_NS)

          class PageParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.meta = {}
                  self.title_parts = []
                  self.jsonld_parts = []
                  self._in_title = False
                  self._in_jsonld = False
                  self._current_jsonld = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)

                  if tag == "title":
                      self._in_title = True

                  if tag == "meta":
                      key = attrs.get("property") or attrs.get("name")
                      value = attrs.get("content")
                      if key and value:
                          self.meta[key.lower()] = value

                  if tag == "script" and attrs.get("type", "").lower() == "application/ld+json":
                      self._in_jsonld = True
                      self._current_jsonld = []

              def handle_endtag(self, tag):
                  if tag == "title":
                      self._in_title = False

                  if tag == "script" and self._in_jsonld:
                      self.jsonld_parts.append("".join(self._current_jsonld))
                      self._current_jsonld = []
                      self._in_jsonld = False

              def handle_data(self, data):
                  if self._in_title:
                      self.title_parts.append(data)
                  if self._in_jsonld:
                      self._current_jsonld.append(data)

          def collect_types(value):
              found = []
              if isinstance(value, dict):
                  item_type = value.get("@type")
                  if isinstance(item_type, str):
                      found.append(item_type.lower())
                  elif isinstance(item_type, list):
                      found.extend(str(entry).lower() for entry in item_type)
                  for child in value.values():
                      found.extend(collect_types(child))
              elif isinstance(value, list):
                  for child in value:
                      found.extend(collect_types(child))
              return found

          def collect_published_dates(value):
              found = []
              if isinstance(value, dict):
                  published = value.get("datePublished")
                  if published:
                      found.append(str(published))
                  for child in value.values():
                      found.extend(collect_published_dates(child))
              elif isinstance(value, list):
                  for child in value:
                      found.extend(collect_published_dates(child))
              return found

          def parse_date(value):
              if not value:
                  return None

              value = value.strip()

              try:
                  parsed = datetime.fromisoformat(value.replace("Z", "+00:00"))
                  if parsed.tzinfo is None:
                      parsed = parsed.replace(tzinfo=timezone.utc)
                  return parsed.astimezone(timezone.utc)
              except ValueError:
                  pass

              try:
                  parsed = parsedate_to_datetime(value)
                  if parsed.tzinfo is None:
                      parsed = parsed.replace(tzinfo=timezone.utc)
                  return parsed.astimezone(timezone.utc)
              except (TypeError, ValueError, OverflowError):
                  pass

              try:
                  return datetime.combine(
                      date.fromisoformat(value[:10]),
                      datetime.min.time(),
                      tzinfo=timezone.utc
                  )
              except ValueError:
                  return None

          def fallback_git_date(filename):
              result = subprocess.run(
                  ["git", "log", "--follow", "--format=%aI", "--reverse", "--", filename],
                  capture_output=True,
                  text=True,
                  check=False
              )
              dates = [line.strip() for line in result.stdout.splitlines() if line.strip()]
              for value in dates:
                  parsed = parse_date(value)
                  if parsed:
                      return parsed

              return datetime.now(timezone.utc)

          channel = ET.Element("channel")
          ET.SubElement(channel, "title").text = "Articoli di Marco Palmas"
          ET.SubElement(channel, "link").text = f"{SITE_URL}/articoli.html"
          ET.SubElement(channel, "description").text = (
              "Nuovi articoli su stress, mindfulness, sport, infermieristica e vita reale."
          )
          ET.SubElement(channel, "language").text = "it-IT"
          ET.SubElement(
              channel,
              f"{{{ATOM_NS}}}link",
              {
                  "href": f"{SITE_URL}/feed.xml",
                  "rel": "self",
                  "type": "application/rss+xml"
              }
          )
          ET.SubElement(channel, "lastBuildDate").text = format_datetime(
              datetime.now(timezone.utc),
              usegmt=True
          )

          articles = []

          for path in Path(".").glob("*.html"):
              parser = PageParser()

              try:
                  parser.feed(path.read_text(encoding="utf-8"))
              except (OSError, UnicodeDecodeError):
                  continue

              jsonld_objects = []
              for raw_jsonld in parser.jsonld_parts:
                  try:
                      jsonld_objects.append(json.loads(raw_jsonld))
                  except json.JSONDecodeError:
                      continue

              page_types = collect_types(jsonld_objects)
              is_article = (
                  parser.meta.get("og:type", "").lower() == "article"
                  or any(
                      item_type in {"article", "blogposting", "newsarticle"}
                      for item_type in page_types
                  )
              )

              if not is_article:
                  continue

              title = " ".join(" ".join(parser.title_parts).split())
              title = title.removesuffix(" | Marco Palmas").strip()
              if not title:
                  title = path.stem.replace("-", " ").capitalize()

              description = (
                  parser.meta.get("description")
                  or parser.meta.get("og:description")
                  or ""
              ).strip()

              canonical = parser.meta.get("og:url") or f"{SITE_URL}/{path.name}"

              published_value = next(
                  iter(collect_published_dates(jsonld_objects)),
                  None
              )

              if not published_value:
                  for key in (
                      "article:published_time",
                      "datepublished",
                      "pubdate",
                      "date"
                  ):
                      if parser.meta.get(key):
                          published_value = parser.meta[key]
                          break

              published_date = parse_date(published_value)
              if not published_date:
                  published_date = fallback_git_date(path.name)

              articles.append({
                  "title": title,
                  "description": description,
                  "link": canonical,
                  "date": published_date
              })

          articles.sort(key=lambda article: article["date"], reverse=True)

          for article in articles:
              item = ET.SubElement(channel, "item")
              ET.SubElement(item, "title").text = article["title"]
              ET.SubElement(item, "link").text = article["link"]
              ET.SubElement(item, "description").text = article["description"]
              ET.SubElement(
                  item,
                  "guid",
                  {"isPermaLink": "true"}
              ).text = article["link"]
              ET.SubElement(item, "pubDate").text = format_datetime(
                  article["date"],
                  usegmt=True
              )

          rss = ET.Element("rss", {"version": "2.0"})
          rss.append(channel)

          tree = ET.ElementTree(rss)
          ET.indent(tree, space="  ")
          tree.write("feed.xml", encoding="UTF-8", xml_declaration=True)

          print(f"Feed generato: {len(articles)} articoli.")
          PY

      - name: Commit feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.xml

          if git diff --cached --quiet; then
            echo "feed.xml è già aggiornato."
            exit 0
          fi

          git commit -m "chore: update RSS feed [skip ci]"
          git push
